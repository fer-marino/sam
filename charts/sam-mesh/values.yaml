global:
  imageTag: local
  imagePullPolicy: IfNotPresent

# One Gateway fronting the mesh: the control plane's enrollment surface plus the console
# under gateway.consolePath.
gateway:
  enabled: false
  # Required when enabled. No default: the GatewayClass is provider-specific, e.g.
  # cloud-provider-kind in kind, gke-l7-global-external-managed on GKE.
  className: ""
  # Routes the control plane's /admin API. Dev only.
  adminRoute: false
  # External prefix the console is served under. Empty leaves the console unrouted.
  consolePath: /console
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  hostnames: []
  addresses: []
  annotations: {}

controlPlane:
  replicaCount: 2
  image:
    repository: sam-control-plane
    # Overrides global.imageTag for this image only.
    tag: ""
  logLevel: info
  # Leave empty to auto-generate a random admin token on first install (kept
  # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
  adminToken: ""
  autoApproveEnrollment: true
  # Only skips TLS verification for the OIDC issuer; leave false unless
  # pointing at a local/dev issuer without a valid certificate.
  insecureSkipTlsVerify: false
  # Required: the chart bundles no identity provider. Point it at your OIDC issuer
  # (comma-separated for more than one); the control plane refuses to start without one.
  oidcIssuer: ""
  allowedAudiences: "sam-mesh-audience,sam-control-plane-audience"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    # Dockerfiles say "USER nonroot" by name; runAsNonRoot needs the numeric uid.
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
    nodePort: null

database:
  type: postgres
  postgres:
    deployInternal: true
    image:
      repository: postgres
      tag: 16-alpine
    user: sam
    # Leave empty to auto-generate a random password on first install (kept
    # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
    password: ""
    database: sam_mesh
    port: 5432
    sslmode: disable
    storageSize: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

router:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    # Dockerfiles say "USER nonroot" by name; runAsNonRoot needs the numeric uid.
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 65532
    fsGroupChangePolicy: "OnRootMismatch"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  image:
    repository: sam-router
    # Overrides global.imageTag for this image only.
    tag: ""
  useOidcToken: false
  logLevel: info
  # Binds 4501 TCP+UDP on the router's own node and announces /ip4/<node IP>/... for both
  # transports. One router per node.
  hostPort: null
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Overrides the announced multiaddrs; derived from hostPort when left empty.
  externalAddrs: []
  allowLoopback: false
  # PVC for /data/router.key, so the libp2p peer ID survives rescheduling.
  storageSize: 1Gi
  # PVC StorageClass; cluster default when null.
  storageClass: null
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 4501

console:
  enabled: true
  replicaCount: 1
  # Origin browsers reach the console on, e.g. https://console.example. Set this
  # when a proxy terminates TLS: without it the OIDC redirect_uri and the cookie
  # Secure flag are derived from the Host and X-Forwarded-Proto headers, so a
  # proxy that drops the header leaves session cookies without Secure.
  externalUrl: ""
  image:
    repository: sam-console
    # Overrides global.imageTag for this image only.
    tag: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    # Dockerfiles say "USER nonroot" by name; runAsNonRoot needs the numeric uid.
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8081
    nodePort: null

bootstrap:
  bindings: []
  # Identities that may enroll as sam:role:node ("user:<sub>", "group:<name>",
  # "email:<addr>", or "sam:system:authenticated" for an intentionally open
  # mesh). Empty means no node can enroll until an operator grants it (fail
  # closed). Ignored when bindings is set: then you own the whole list.
  nodeMembers: []
  # Services sam:role:node may call, as "type://name" entries (e.g.
  # "mcp://calculator"). Any authenticated identity can claim sam:role:node,
  # so this list is effectively mesh-wide. Empty means nodes can call nothing
  # until a policy grants it (fail closed); never use ["*"] outside an
  # intentionally public mesh.
  nodeServices: []
  # Label patterns ("key=value" or "key=*") sam:role:node may attest with the
  # labels in its sam-node.yaml. Empty means nodes cannot enroll with any label
  # (fail closed).
  nodeLabels: []
